# Runs only when ops/ansible/secrets/dashboard-oauth.yml exists (see site.yml).

- name: oauth2-proxy system user
  ansible.builtin.user:
    name: oauth2-proxy
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download oauth2-proxy (pinned version, checksum-verified)
  ansible.builtin.get_url:
    url: "https://github.com/oauth2-proxy/oauth2-proxy/releases/download/{{ oauth2_proxy_version }}/oauth2-proxy-{{ oauth2_proxy_version }}.linux-amd64.tar.gz"
    dest: "/opt/oauth2-proxy-{{ oauth2_proxy_version }}.tar.gz"
    checksum: "sha256:{{ oauth2_proxy_sha256 }}"
    mode: "0644"

- name: Unpack oauth2-proxy
  ansible.builtin.unarchive:
    src: "/opt/oauth2-proxy-{{ oauth2_proxy_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/oauth2-proxy-{{ oauth2_proxy_version }}.linux-amd64/oauth2-proxy"

- name: Point /usr/local/bin/oauth2-proxy at the pinned version
  ansible.builtin.file:
    src: "/opt/oauth2-proxy-{{ oauth2_proxy_version }}.linux-amd64/oauth2-proxy"
    dest: /usr/local/bin/oauth2-proxy
    state: link
  notify: Restart oauth2-proxy

- name: Config directory (readable by oauth2-proxy only)
  ansible.builtin.file:
    path: /etc/oauth2-proxy
    state: directory
    owner: root
    group: oauth2-proxy
    mode: "0750"

- name: Dashboard config (holds the client and cookie secrets)
  ansible.builtin.template:
    src: dashboard.cfg.j2
    dest: /etc/oauth2-proxy/dashboard.cfg
    owner: root
    group: oauth2-proxy
    mode: "0640"
  no_log: true
  notify: Restart oauth2-proxy

- name: Individually allowed Google accounts
  ansible.builtin.template:
    src: dashboard-allowed-emails.txt.j2
    dest: /etc/oauth2-proxy/dashboard-allowed-emails.txt
    owner: root
    group: oauth2-proxy
    mode: "0640"
  notify: Restart oauth2-proxy

- name: systemd unit
  ansible.builtin.template:
    src: oauth2-proxy.service.j2
    dest: /etc/systemd/system/oauth2-proxy.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart oauth2-proxy

- name: oauth2-proxy enabled and running
  ansible.builtin.systemd_service:
    name: oauth2-proxy
    enabled: true
    state: started
    daemon_reload: true
