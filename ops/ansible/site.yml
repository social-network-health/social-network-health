---
# Provision the socialnetwork.health droplet: the static site, the team dashboard, and listmonk
# for the monthly update (updates.socialnetwork.health).
# Independent of fellows_local_db — no shared roles, no cross-repo deps.
#
#   cd ops/ansible
#   ansible-playbook site.yml                 # full bootstrap (as root)
#   ansible-playbook site.yml --tags caddy    # re-render Caddy config only
#
# First run only: accept the droplet host key first, e.g.
#   ssh-keyscan -p 22 <droplet-ip> >> ~/.ssh/known_hosts

- name: socialnetwork.health static site
  hosts: web
  gather_facts: true
  # Gitignored secrets (ops/ansible/secrets/*.yml): the dashboard password hash and the dashboard's
  # Google sign-in client. Each is optional; without them the dashboard fails closed (503).
  pre_tasks:
    - name: Load gitignored secrets if present
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/secrets/*.yml', wantlist=True) }}"
      no_log: true
      tags: ["always"]
  roles:
    - role: common
      tags: ["bootstrap"]
    # Before caddy, so the sign-in service is up when Caddy starts pointing at it.
    - role: oauth2_proxy
      when: dashboard_oauth_client_id is defined
      tags: ["bootstrap", "caddy"]
    # Before caddy, so listmonk is up when Caddy starts proxying updates_domain to it.
    - role: listmonk
      tags: ["bootstrap", "listmonk"]
    - role: caddy
      tags: ["bootstrap", "caddy"]
    # Rebuilds the dashboard from snh-aios main every hour (needs `just dashboard-sync-key` once).
    - role: dashboard_sync
      tags: ["bootstrap", "dashboard_sync"]
